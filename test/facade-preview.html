nction frame(now){requestAnimationFrame(frame);city.housingView.update(inside?p(-2.5,0,3):p(0,0,-4),inside,now,{floor:0});city.updateVisibility(camera.position,now);renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){document.getElementById('status').textContent='Erreur : '+e.message;console.error(e)}
