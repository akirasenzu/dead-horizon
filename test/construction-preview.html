<!doctype html><html lang="fr"><meta charset="utf-8"><title>Dead Horizon · Travaux</title><style>*{box-sizing:border-box}body{margin:0;background:#18241f;color:#e7e4d6;font:13px Segoe UI}#view{width:calc(100vw - 360px);height:100vh;display:block}aside{position:fixed;right:0;top:0;width:360px;height:100vh;padding:20px;overflow:auto}h1{font-size:22px}button,select{padding:8px;margin:3px;background:#d3a274;color:#16221c;border:0}p{line-height:1.5}#status{color:#eac59f}#aux{display:none}header{position:fixed;top:20px;left:20px;background:#18241fdd;padding:12px 18px}</style><canvas id="view"></canvas><header>DEAD HORIZON · NIVEAUX DE 3 M · TRAVAUX</header><aside><h1>Construction & aménagement</h1><p>Vérification locale · outils et matériaux de test.</p><button id="inside">INTÉRIEUR</button><button id="outside">FAÇADE</button><div id="workshop"></div><p id="status">Chargement…</p></aside><div id="aux"><canvas id="mini-map"></canvas><canvas id="city-map"></canvas><dialog id="map-dialog"></dialog><p id="map-waypoint"></p><button id="clear-waypoint"></button></div><script type="module">
import * as T from './vendor/three.module.js';import {createCity} from './city.js';import {createLocalService} from './local-engine.js';import {setupConstructionUI} from './construction-ui.js';import {createHumanoid} from './humanoid.js';
try{const renderer=new T.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});renderer.setSize(innerWidth-360,innerHeight);renderer.setPixelRatio(1.5);renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color(0xaabac2);scene.add(new T.HemisphereLight(0xc4d7ed,0x636350,1.65));const light=new T.DirectionalLight(0xffe7c7,2.5);light.position.set(50,90,30);scene.add(light);const camera=new T.PerspectiveCamera(65,(innerWidth-360)/innerHeight,.05,1500),city=await createCity(scene),service=createLocalService(city.data),{world,player:p}=service.startLocal({name:'Vérification travaux'}),rules=service.survival.rules;world.zombies=[];p.bag.push(rules.item('toolkit'),rules.item('buildingMaterials',9));const h=service.housing.houses.find(h=>h.enterable&&h.partitions.length>0&&h.w>5&&h.d>5);world.doors[h.id]=true;let placed=false;outer:for(let u=-6;u<=6;u+=.5)for(let v=3;v<12;v+=.5){const q=h.point(u,v);if(service.housing.blocked(...q,.55))continue;p.x=q[0];p.z=q[1];service.command(world,p,{type:'buildPanel',kind:'door',axis:'u',u,v:v+2},Date.now());if(world.construction.panels.length){placed=true;break outer}}if(!placed)throw Error('Emplacement non trouvé');const actor=createHumanoid();actor.g.position.set(p.x,0,p.z);scene.add(actor.g);let mode='inside';const local=(u,y,v)=>{const q=h.point(u,v);return new T.Vector3(q[0],y,q[1])};function position(){camera.position.copy(mode==='inside'?local(5,10,1):local(0,3.6,-9));camera.lookAt(mode==='inside'?new T.Vector3(p.x,0,p.z+1):local(0,4,2))}const ui=setupConstructionUI(document.getElementById('workshop'),cmd=>{service.command(world,p,cmd,Date.now());sync()});function sync(){const state=service.snapshot(world,p,Date.now());city.housing.setDoors(world.doors);city.housingView.setConstruction(state.construction);ui.update(state.workshop);document.getElementById('status').textContent=state.notice?.message||'Prêt';document.getElementById('status').dataset.panels=world.construction.panels.length}sync();document.querySelector('details').open=true;document.getElementById('inside').onclick=()=>{mode='inside';position()};document.getElementById('outside').onclick=()=>{mode='outside';position()};position();function frame(now){requestAnimationFrame(frame);city.housingView.update(new T.Vector3(p.x,0,p.z),mode==='inside',now,{floor:0});city.updateVisibility(camera.position,now);renderer.render(scene,camera)}requestAnimationFrame(frame)}catch(e){document.getElementById('status').textContent=e.stack;console.error(e)}
</script></html>
