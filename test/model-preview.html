<!doctype html><html lang="fr"><meta charset="utf-8"><title>Dead Horizon · Atelier des modèles</title><style>*{box-sizing:border-box}body{margin:0;background:#172321;color:#e1e8db;font:15px system-ui}header{padding:20px 30px;display:flex;gap:24px;align-items:center}h1{font-size:22px;margin:0}select{background:#304039;color:#fff;padding:10px;border:1px solid #71806a}canvas{display:block;width:100vw;height:calc(100vh - 90px)}#status{color:#b6c3af;font-size:12px}footer{position:absolute;bottom:24px;left:4%;right:4%;display:flex;justify-content:space-around;font-size:13px;letter-spacing:2px}</style>
<header><h1>DEAD HORIZON <small>· Modèles 3D</small></h1><select id="weapon"></select><select id="pose"><option value="idle">Au repos</option><option value="walk">Marche</option><option value="aim">Visée</option><option value="reload">Rechargement</option><option value="fps">Première personne</option></select><span id="status">Chargement…</span></header><canvas id="view"></canvas><footer><span>SURVIVANT</span><span>ÉQUIPEMENT</span><span>INFECTÉS</span></footer>
<script type="module">
import * as T from './vendor/three.module.js';import{createHumanoid,animateHumanoid,setHumanoidAppearance}from'./humanoid.js';import{equipCharacter,WEAPONS,ARMORS}from'./equipment.js';import{configureWeapon}from'./arsenal-catalog.js';import{buildWeaponModel,poseWeapon,disposeModel}from'./weapon-model.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;const scene=new T.Scene();scene.background=new T.Color('#263731');scene.add(new T.HemisphereLight(0xe9eddf,0x485a49,2.4));const light=new T.DirectionalLight(0xffe4bc,3);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-5;light.shadow.camera.right=5;scene.add(light);const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x34443a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.025;ground.receiveShadow=true;scene.add(ground);
const camera=new T.PerspectiveCamera(32,1,.01,100),civil=createHumanoid(),soldier=createHumanoid(),zombies=[1,3,5].map(variant=>createHumanoid({zombie:true,variant}));setHumanoidAppearance(civil,{skin:2,hair:1,hairstyle:'short',beard:'stubble',outfit:0});civil.g.position.x=-2.25;civil.g.rotation.y=.35;soldier.g.rotation.y=-.15;scene.add(civil.g,soldier.g);zombies.forEach((p,i)=>{p.g.position.set(1.65+i*.72,0,i===1?-.4:0);p.g.rotation.y=-.35;scene.add(p.g)});soldier.clothing={id:'military',top:0x6e7856,pants:0x424c3b};soldier.armor=ARMORS.find(a=>a.helmet)||ARMORS.at(-1);soldier.hasBackpack=true;soldier.appearance={skin:1,height:100};let display;
