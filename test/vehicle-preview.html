const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;const scene=new T.Scene();scene.background=new T.Color(0xb2c4ca);scene.fog=new T.Fog(0xb2c4ca,70,220);scene.add(new T.HemisphereLight(0xd5e6f1,0x6f7560,2));const sun=new T.DirectionalLight(0xffefd9,3);sun.position.set(-8,14,6);sun.castShadow=true;sun.shadow.normalBias=.035;sun.shadow.bias=-.00015;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshStandardMaterial({color:0x7a8272,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.025;ground.receiveShadow=true;scene.add(ground);const road=new T.Mesh(new T.PlaneGeometry(12,300),new T.MeshStandardMaterial({color:0x525a59,roughness:.95}));road.rotation.x=-Math.PI/2;road.position.y=-.015;scene.add(road);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.04,300);let car,angle=.65,orbit=false,inside=false;const select=document.querySelector('#model');select.innerHTML=VEHICLES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');select.value='dada';function update(){if(car){scene.remove(car);disposeModel(car)}const spec=VEHICLES.find(s=>s.id===select.value);car=buildVehicle(spec);scene.add(car);document.querySelector('#report').textContent=`${spec.name} · ${spec.kind} · carrosserie, vitrages et habitacle`};select.onchange=update;document.querySelector('#rear').onclick=()=>{angle+=Math.PI;inside=false};document.querySelector('#inside').onclick=()=>inside=!inside;document.querySelector('#orbit').onclick=()=>orbit=!orbit;update();let previous=0;function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(orbit)angle+=dt*.18;if(inside&&car.userData.cabin){const c=car.userData.cabin;camera.fov=75;camera.position.set(car.userData.width*.23,c.ey
