<!doctype html><html lang="fr"><meta charset="utf-8"><title>Dead Horizon · Atelier mécanique</title><link rel="stylesheet" href="style.css?v=5.3"><style>body{margin:0;background:#b2c4ca}body:after{display:none}canvas{display:block}#qa-tools{position:fixed;top:18px;left:20px;display:flex;gap:12px;background:#182d25ed;padding:14px;align-items:center;z-index:2}#qa-tools strong{color:#e0e6ce;font-size:13px}#report{position:fixed;bottom:18px;left:20px;background:#172b25e8;padding:12px;color:#e1e5d2;font-size:12px}#ammo-dialog{max-height:91vh;overflow:auto}</style><div id="qa-tools"><strong>DEAD HORIZON · MÉCANIQUE</strong><button id="inspect">INSPECTER LE VÉHICULE</button><button id="reset">RECOMMENCER L’ESSAI</button></div><canvas id="view"></canvas><dialog id="ammo-dialog"></dialog><output id="report">Chargement…</output><script type="module">
import * as T from './vendor/three.module.js';import{createLocalService}from'./local-engine.js';import{VEHICLES,buildVehicle}from'./vehicles.js';import{ensureVehicleParts,fitFor,vehicleSlots}from'./vehicle-parts.js';import{updateVehicleService,createLooseVehiclePart}from'./vehicle-service-view.js';import{setupSurvivalUI}from'./survival-ui.js';import{disposeModel}from'./model-kit.js';
const map={gameScale:1.3,spawn:[0,0],buildings:[],roads:[{k:'residential',p:[[-40,0],[40,0]]}],rails:[],parks:[],landmarks:[]},service=createLocalService(map),spec=VEHICLES.find(s=>s.id==='dada'),r=service.survival.rules;
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;const scene=new T.Scene();scene.background=new T.Color(0xb2c4ca);scene.add(new T.HemisphereLight(0xd8e7ed,0x72785f,2.2));const sun=new T.DirectionalLight(0xffebce,3);sun.position.set(-7,12,8);sun.castShadow=true;sun.shadow.normalBias=.035;sun.shadow.bias=-.00015;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x5d6961}));ground.rotation.x=-Math.PI/2;ground.position.y=-.025;ground.receiveShadow=true;scene.add(ground);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.05,400);camera.position.set(7,4.3,8.3);camera.lookAt(0,1.1,.5);let world,p,v,model;const looseModels=new Map();
function reset(){for(const m of looseModels.values()){scene.remove(m);disposeModel(m)}looseModels.clear();if(model){scene.remove(model);disposeModel(model)}const fresh=service.startLocal({name:'Alex',profession:'mechanic'});world=fresh.world;p=fresh.player;v=world.vehicles[0];v.spec=spec.id;v.condition=90;v.fuel=60;v.x=v.z=v.angle=0;v.locked=false;v.mechanicsVersion=0;ensureVehicleParts(v,spec);world.vehicles=[v];world.zombies=[];p.x=3.6;p.z=0;p.bag.push(...['toolkit','screwdriver','jack','lugWrench','part','water'].map(id=>r.item(id)),{uid:crypto.randomUUID(),def:'vehicleKey',qty:1,vehicle:v.id});for(const tyre of['road','race','rally','offroad'])service.survival.drop(world,p,[r.item('vpart:wheel:'+tyre,1,{fit:fitFor(spec,'wheelFL'),condition:95})],'Roues de l’atelier · '+tyre);model=buildVehicle(spec);scene.add(model);r.sync(p);sync()}
const ui=setupSurvivalUI({send(command){service.command(world,p,command,Date.now());sync()},onOpen(){}});function sync(){if(!world)return;updateVehicleService(model,v);const snapshot=service.snapshot(world,p,Date.now());ui.update(snapshot);const ids=new Set();for(const item of snapshot.inventory.looseParts){ids.add(item.uid);let m=looseModels.get(item.uid);if(!m){m=createLooseVehiclePart(item);scene.add(m);looseModels.set(item.uid,m)}const a=[...item.uid].reduce((s,c)=>s+c.charCodeAt(0),0)*.71;m.position.set(item.x+Math.sin(a)*.65,.04,item.z+Math.cos(a)*.65);m.rotation.y=a}for(const[id,m]of looseModels)if(!ids.has(id)){scene.remove(m);disposeModel(m);looseModels.delete(id)}document.querySelector('#report').textContent=`${v.engineRunning?'Moteur en marche':'Moteur arrêté'} · capot ${v.hoodOpen?'ouvert':'fermé'} · ${vehicleSlots(spec).filter(s=>v.components[s]).length}/${vehicleSlots(spec).length} pièces installées · ${Math.round(v.temperature)} °C`;document.querySelector('#report').dataset.parts=JSON.stringify(Object.fromEntries(Object.entries(v.components).map(([id,item])=>[id,item?.def||null])))}document.querySelector('#inspect').onclick=()=>ui.open();document.querySelector('#reset').onclick=reset;reset();let last=0;function frame(now){requestAnimationFrame(frame);if(now-last>100){const time=Date.now();p.seen=p.inputAt=time;p.input={x:0,z:0,yaw:0};service.step(world,time);sync();last=now}renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
