<!doctype html><html lang="fr"><meta charset="utf-8"><title>Hazebrouck — vérification des maisons</title><style>body{margin:0;background:#19251e;color:#eee;font:13px Segoe UI}canvas#view{display:block;width:100vw;height:100vh}nav{position:fixed;top:18px;left:18px;background:#17231de8;padding:14px;display:flex;gap:10px;align-items:center}button{background:#cb925e;color:#14231c;border:0;padding:9px 13px;cursor:pointer}output{position:fixed;bottom:20px;left:20px;background:#17231dd9;padding:12px}#aux{display:none}</style><canvas id="view"></canvas><nav><strong>HAZEBROUCK · MAISONS</strong><button id="outside">Rue</button><button id="inside">Intérieur · 3e personne</button><button id="fps">Intérieur · 1re personne</button><button id="door">Ouvrir / fermer</button><button id="next">Maison suivante</button></nav><output id="report">Chargement…</output><div id="aux"><canvas id="mini-map"></canvas><canvas id="city-map"></canvas><dialog id="map-dialog"></dialog><p id="map-waypoint"></p><button id="clear-waypoint"></button></div><script type="module">
import * as T from './vendor/three.module.js';import{createCity}from'./city.js?v=2.1';
const renderer=new T.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color(0xa0acb1);scene.fog=new T.FogExp2(0xa0acb1,.0018);scene.add(new T.HemisphereLight(0xc4d7ed,0x636350,1.65));const sun=new T.DirectionalLight(0xffe7c7,2.5);sun.position.set(-50,90,30);scene.add(sun);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,1500),city=await createCity(scene);const houses=city.housing.houses.filter(h=>h.enterable&&h.furniture.length>=4).sort((a,b)=>Math.hypot(a.x-city.spawn.x,a.z-city.spawn.z)-Math.hypot(b.x-city.spawn.x,b.z-city.spawn.z));let index=0,mode='outside',third=false;
const actor=new T.Group();scene.add(actor);function box(w,h,d,x,y,z,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c}));m.position.set(x,y,z);actor.add(m)}box(.65,.9,.4,0,1.1,0,0x61765b);box(.45,.45,.45,0,1.83,0,0xd1ae83);for(const x of[-.2,.2])box(.23,.8,.28,x,.35,0,0x303b36);
function position(){const h=houses[index],p=(u,y,v)=>{const q=h.point(u,v);return new T.Vector3(q[0],y,q[1])};const target=mode==='outside'?p(0,0,-4):p(0,0,3);third=mode==='inside';actor.visible=mode!=='fps';actor.position.copy(target);actor.rotation.y=Math.atan2(h.door.nx,h.door.nz);camera.position.copy(mode==='outside'?p(4,3,-13):mode==='fps'?p(0,1.85,3):p(1.8,3.1,1.3));camera.lookAt(mode==='outside'?p(0,3.8,4):p(0,1.45,8));city.housingView.update(target,third,performance.now()+300);city.updateVisibility(camera.position,performance.now()+300);document.getElementById('report').textContent=`${city.housing.count.toLocaleString('fr-FR')} bâtiments accessibles · ${city.housingView.stats().loaded} intérieurs chargés à proximité · ${h.furniture.length} meubles · hauteur libre 3,4 m · ${mode==='outside'?'rue':mode==='inside'?'rez-de-chaussée · toit escamoté':'rez-de-chaussée · plafond visible'}`;return target}
document.getElementById('outside').onclick=()=>{mode='outside';position()};document.getElementById('inside').onclick=()=>{mode='inside';position()};document.getElementById('fps').onclick=()=>{mode='fps';position()};document.getElementById('door').onclick=()=>{city.housing.toggleDoor(houses[index]);position()};document.getElementById('next').onclick=()=>{index=(index+1)%houses.length;position()};position();let stamp=0;function frame(now){requestAnimationFrame(frame);const h=houses[index],p=h.point(0,mode==='outside'?-4:3);city.housingView.update(new T.Vector3(p[0],0,p[1]),third,now);if(now-stamp>500){document.getElementById('report').dataset.drawCalls=renderer.info.render.calls;document.getElementById('report').dataset.triangles=renderer.info.render.triangles;stamp=now}renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
