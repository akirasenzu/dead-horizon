name: Dead Horizon Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Préparer les ressources vérifiées
        run: node scripts/prepare-assets.mjs
      - name: Installer et vérifier le serveur
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Construire le lanceur Windows
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Préparer le téléchargement
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop/release -Force | Out-Null
          Copy-Item desktop/publish/DeadHorizon.exe desktop/release/DeadHorizon.exe
          Copy-Item desktop/LIRE-MOI.txt desktop/release/LIRE-MOI.txt
          Copy-Item web/game/MAP-LICENSE.txt desktop/release/LICENCE-CARTE.txt
          Copy-Item web/game/vendor/THREE-LICENSE.txt desktop/release/LICENCE-THREE.txt
          $checksum=(Get-FileHash desktop/release/DeadHorizon.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  DeadHorizon.exe" | Set-Content -Encoding utf8 desktop/release/SHA256SUMS.txt
          Compress-Archive -Path desktop/release/* -DestinationPath desktop/DeadHorizon-Windows.zip -CompressionLevel Optimal
      - name: Publier la version PC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag="pc-v2.1.$env:GITHUB_RUN_NUMBER"
          gh release create $tag desktop/release/DeadHorizon.exe desktop/DeadHorizon-Windows.zip desktop/release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dead Horizon PC — Maisons accessibles" --notes-file desktop/RELEASE-NOTES.md --latest
