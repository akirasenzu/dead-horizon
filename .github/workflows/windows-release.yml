name: Dead Horizon Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Préparer les ressources vérifiées
        run: node scripts/prepare-assets.mjs
      - name: Installer et vérifier le serveur
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Vérifier les mises à jour automatiques
        run: dotnet run --project test/updater/Updater.Tests.csproj -c Release
      - name: Construire le lanceur Windows
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Préparer le téléchargement vérifié
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - name: Publier la version PC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version=(Get-Content desktop/publish/version.txt -Raw).Trim()
          $tag="pc-v$version"
          $assets=@('desktop/release/DeadHorizon.exe','desktop/DeadHorizon-Windows.zip','desktop/release/SHA256SUMS.txt','desktop/release/update.json')
          $existing=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if($LASTEXITCODE -eq 0){
            if(!(($existing | ConvertFrom-Json).isDraft)){throw 'Cette version est déjà publiée et reste immuable.'}
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }else{
            gh release create $tag @assets --draft --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dead Horizon PC — Mises à jour automatiques" --notes-file desktop/RELEASE-NOTES.md
          }
          if($LASTEXITCODE -ne 0){throw 'Préparation de la publication impossible.'}
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE -ne 0){throw 'Publication impossible.'}
